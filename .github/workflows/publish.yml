name: Publish Next Day

on:
  workflow_dispatch:

  schedule:
    # 10:00 AM IST (04:30 UTC)
    - cron: "30 4 * * *"

    # 8:00 PM IST (14:30 UTC)
    - cron: "30 14 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content
          path: temp-content
          fetch-depth: 0

      - name: Find, copy and publish next folder
        shell: bash
        run: |
          set -e

          NEXT=""

          # Find the first DayXXX folder not present in main
          for folder in temp-content/Day*; do
            name=$(basename "$folder")

            if [ ! -d "$name" ]; then
              NEXT="$name"
              break
            fi
          done

          if [ -z "$NEXT" ]; then
            echo "✅ All folders have already been published."
            exit 0
          fi

          echo "Publishing $NEXT"

          # Copy only the next folder
          cp -R "temp-content/$NEXT" .

          # Remove temporary checkout
          git rm -r --cached temp-content >/dev/null 2>&1 || true
          rm -rf temp-content

          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the published folder
          git add "$NEXT"

          # Skip if nothing changed
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Publish $NEXT"

          git push origin main